schema_version: 2

meta:
  description: "A classic Spanish rice dish with saffron, chorizo, and plump shrimp."
  source: "Original"
  cuisine: "Spanish"

portion:
  quantity: 4
  descriptor: "servings"
  active_time_minutes: 60
  passive_time_minutes: 30
  complexity_rating: 3
  mayhem_rating: 2

tags:
- "Spanish"

tables:
- name: Paella
  stages:
  - id: heat_paella_oil
    inputs:
    - ingredient: Olive oil
      quantity: 30
      measurement: ml
    action: Heat
    hint: "medium heat"
  - id: brown_chorizo
    inputs:
    - stage: heat_paella_oil
    - ingredient: Chorizo sausage
      quantity: 150
      measurement: grams
      hint: "sliced into rounds"
    action: Brown
    hint: "remove and reserve"
  - id: saute_paella_aromatics
    inputs:
    - ingredient: Garlic
      quantity: 2
      measurement: clove
      hint: "minced"
    - ingredient: Onion
      quantity: 1
      measurement: unit
      hint: "finely diced"
    - ingredient: Red bell pepper
      quantity: 1
      measurement: unit
      hint: "diced"
    action: Sauté
    hint: "in the same pan; about 5 minutes, until soft"
  - id: cook_shrimp
    inputs:
    - stage: saute_paella_aromatics
    - ingredient: Shrimp
      quantity: 300
      measurement: grams
      hint: "peeled and deveined"
    action: Cook
    hint: "about 2 minutes per side, until pink; remove and reserve"
  - id: toast_paella_rice
    inputs:
    - stage: cook_shrimp
      part: "aromatic base left in the pan"
    - ingredient: Short-grain rice
      quantity: 400
      measurement: grams
    action: Toast
    hint: "2 minutes"
  - id: simmer_paella
    inputs:
    - stage: toast_paella_rice
    - ingredient: Chicken broth
      quantity: 950
      measurement: ml
    - ingredient: Paprika
      quantity: 5
      measurement: grams
    - ingredient: Saffron threads
      quantity: 0.5
      measurement: grams
    - ingredient: Salt
      quantity: 1
      measurement: pinch
    action: Simmer
    hint: "bring to a simmer, then cover; low heat for 20 minutes without stirring"
  - id: return_paella_proteins
    inputs:
    - stage: simmer_paella
    - stage: brown_chorizo
      part: "reserved chorizo"
    - stage: cook_shrimp
      part: "reserved shrimp"
    action: Return and nestle
    hint: "nestle into the rice"
  - id: finish_paella
    inputs:
    - stage: return_paella_proteins
    action: Cook
    hint: "covered; 10 minutes; until the rice is tender and liquid is absorbed"

items:
- name: Large shallow pan
  quantity: 1

note:
- "For a traditional socarrat (crispy bottom), increase heat for the final 2 minutes."
- "Substitute shrimp with mussels or clams for a different seafood paella."
- "Add a squeeze of lemon juice before serving."
