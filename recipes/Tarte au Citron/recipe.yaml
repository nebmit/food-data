schema_version: 2

meta:
  description: "An elegant French lemon tart with silky lemon curd, candied lemon slices, and a ready-made sweet crust."
  source: "Original"
  cuisine: "French"

portion:
  quantity: 8
  descriptor: "slices"
  active_time_minutes: 25
  passive_time_minutes: 60
  complexity_rating: 2
  mayhem_rating: 2

tags:
- "Dessert"
- "No-bake"
- "Vegetarian"

items:
- name: Saucepan
  quantity: 1
- name: Fine sieve
  quantity: 1

tables:
- name: Candied lemon
  stages:
  - id: lemon_syrup
    inputs:
    - ingredient: Water
      quantity: 215
      measurement: ml
    - ingredient: Sugar
      quantity: 100
      measurement: grams
    action: Bring to a gentle boil

  - id: candied_lemon
    inputs:
    - stage: lemon_syrup
    - ingredient: Lemon
      quantity: 1
      measurement: unit
      hint: "organic; cut into 2 mm slices"
    action: Simmer and cool
    hint: "10 min; until translucent; transfer to parchment paper"
    duration_minutes: 10

- name: Lemon cream
  stages:
  - id: curd_base
    inputs:
    - ingredient: Lemon juice
      quantity: 120
      measurement: ml
    - ingredient: Lemon zest
      quantity: 2
      measurement: tablespoon
    - ingredient: Sugar
      quantity: 120
      measurement: grams
    - ingredient: Egg
      quantity: 3
      measurement: unit
    action: Whisk together
    hint: "until smooth"

  - id: cooked_curd
    inputs:
    - stage: curd_base
    action: Cook
    hint: "medium-low heat; stir constantly; about 82°C; until it coats a spoon"

  - id: lemon_cream
    inputs:
    - stage: cooked_curd
    - ingredient: Butter
      quantity: 175
      measurement: grams
      hint: "cut into small cubes"
    action: Strain and whisk
    hint: "until glossy and fully melted"

  - id: cooled_lemon_cream
    inputs:
    - stage: lemon_cream
    action: Cool
    hint: "10 min"
    duration_minutes: 10

- name: Assembly
  stages:
  - id: filled_tart
    inputs:
    - stage: cooled_lemon_cream
    - ingredient: Sweet tart shell
      quantity: 1
      measurement: unit
      hint: "or homemade pâte sucrée"
    action: Fill and level

  - id: apricot_glaze
    inputs:
    - ingredient: Apricot jam
      quantity: 200
      measurement: grams
    - ingredient: Water
      quantity: 1
      measurement: tablespoon
    action: Warm together
    hint: "gently"

  - id: glazed_tart
    inputs:
    - stage: filled_tart
    - stage: apricot_glaze
    action: Brush with glaze
    hint: "use a thin layer"

  - id: finished_tart
    inputs:
    - stage: glazed_tart
    - stage: candied_lemon
    action: Arrange and chill
    hint: "decorate with lemon slices; refrigerate at least 60 min"
    duration_minutes: 60

note:
- "Using a ready-made crust eliminates all baking."
- "For the crispest crust, serve within 24 hours."
- "Dust with icing sugar just before serving for a elegant finish."
