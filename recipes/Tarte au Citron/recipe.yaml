schema_version: 2

meta:
  description: "An elegant French lemon tart with silky lemon curd, candied lemon slices, and a ready-made sweet crust."
  source: "Original"
  course: "Dessert"
  cuisine: "French"

portion:
  quantity: 8
  descriptor: "slices"
  active_time_minutes: 25
  passive_time_minutes: 70
  complexity_rating: 2
  mayhem_rating: 2

tags:
- "No-bake"
- "Vegetarian"

items:
- name: Saucepan
  quantity: 1
- name: Fine sieve
  quantity: 1

tables:
- name: Candied lemon
  stages:
  - id: boil_lemon_syrup
    inputs:
    - ingredient: Water
      quantity: 215
      measurement: ml
    - ingredient: Sugar
      quantity: 100
      measurement: grams
    action: Boil
    hint: "gently; until the sugar dissolves"

  - id: candy_lemon_slices
    inputs:
    - stage: boil_lemon_syrup
    - ingredient: Lemon
      quantity: 1
      measurement: unit
      hint: "organic; cut into 2 mm slices"
    action: Simmer
    hint: "10–15 min; until translucent; cool in a single layer on parchment paper"
    duration_minutes: 15

- name: Lemon cream
  stages:
  - id: whisk_curd_base
    inputs:
    - ingredient: Lemon
      quantity: 3
      measurement: unit
      hint: "organic; zest two finely, then juice all three, about 120 ml"
    - ingredient: Sugar
      quantity: 120
      measurement: grams
    - ingredient: Egg
      quantity: 3
      measurement: unit
    action: Whisk
    hint: "until smooth"

  - id: cook_curd
    inputs:
    - stage: whisk_curd_base
    action: Cook
    hint: "medium-low heat; stir constantly; about 82°C; until it coats a spoon"

  - id: finish_lemon_cream
    inputs:
    - stage: cook_curd
    - ingredient: Butter
      quantity: 175
      measurement: grams
      hint: "cut into small cubes"
    action: Strain
    hint: "through the sieve; whisk in the butter until glossy and fully melted"

  - id: cool_lemon_cream
    inputs:
    - stage: finish_lemon_cream
    action: Cool
    hint: "10 min"
    duration_minutes: 10

- name: Assembly
  stages:
  - id: fill_tart_shell
    inputs:
    - stage: cool_lemon_cream
    - ingredient: Sweet tart shell
      quantity: 1
      measurement: unit
      hint: "or homemade pâte sucrée"
    action: Fill
    hint: "level the surface"

  - id: chill_tart
    inputs:
    - stage: fill_tart_shell
    action: Chill
    hint: "refrigerate at least 60 min; until set"
    duration_minutes: 60

  - id: decorate_tart
    inputs:
    - stage: chill_tart
    - stage: candy_lemon_slices
    action: Arrange
    hint: "lemon slices over the set cream"

  - id: warm_apricot_glaze
    inputs:
    - ingredient: Apricot jam
      quantity: 50
      measurement: grams
    - ingredient: Water
      quantity: 1
      measurement: tablespoon
    action: Warm
    hint: "gently; until loose enough to brush"

  - id: glaze_tart
    inputs:
    - stage: decorate_tart
    - stage: warm_apricot_glaze
    action: Brush
    hint: "a thin layer over the lemon slices and cream"

note:
- "Using a ready-made crust eliminates all baking."
- "For the crispest crust, serve within 24 hours."
- "Dust with icing sugar just before serving for an elegant finish."
