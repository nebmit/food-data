schema_version: 2

meta:
  description: "Juicy homemade burgers with melted cheddar, fresh toppings, and a tangy burger sauce."
  source: "Original"
  cuisine: "American"

portion:
  quantity: 4
  descriptor: "servings"
  active_time_minutes: 30
  passive_time_minutes: 0
  complexity_rating: 2
  mayhem_rating: 2

tables:
- name: Burger sauce
  stages:
  - id: mix_burger_sauce
    inputs:
    - ingredient: Mayonnaise
      quantity: 60
      measurement: ml
    - ingredient: Ketchup
      quantity: 30
      measurement: ml
    - ingredient: Worcestershire sauce
      quantity: 5
      measurement: ml
    action: Mix

- name: Patties
  stages:
  - id: shape_patties
    inputs:
    - ingredient: Ground beef
      quantity: 450
      measurement: grams
    action: Shape
    hint: "4 patties; slightly wider than the buns; indent the centres"
  - id: season_patties
    inputs:
    - stage: shape_patties
    - ingredient: Olive oil
      quantity: 15
      measurement: ml
    - ingredient: Salt
      hint: "to taste"
    - ingredient: Pepper
      hint: "to taste"
    action: Season
    hint: "coat both sides"
  - id: cook_patties
    inputs:
    - stage: season_patties
    action: Cook
    hint: "medium-high heat; about 4 minutes per side or to preferred doneness"
  - id: melt_cheese
    inputs:
    - stage: cook_patties
    - ingredient: Cheddar cheese
      quantity: 4
      measurement: slice
    action: Melt
    hint: "one slice per patty during the final minute"

- name: Buns
  stages:
  - id: toast_buns
    inputs:
    - ingredient: Burger bun
      quantity: 4
      measurement: unit
      hint: "halved"
    action: Toast
    hint: "cut-side down; until lightly browned"

- name: Assembly
  stages:
  - id: assemble_burgers
    inputs:
    - stage: mix_burger_sauce
    - stage: melt_cheese
    - stage: toast_buns
    - ingredient: Lettuce
      quantity: 4
      measurement: leaf
    - ingredient: Tomato
      quantity: 1
      measurement: unit
      hint: "sliced"
    - ingredient: Red onion
      quantity: 1
      measurement: unit
      hint: "sliced into rings"
    action: Assemble
    hint: "layer sauce, lettuce, patty, tomato, and onion; serve immediately"

items:
- name: Frying pan
  quantity: 1

note:
- "For smash burgers, press the beef balls flat on a very hot pan instead of pre-shaping patties."
- "Add pickles, jalapeños, or crispy bacon for variations."
