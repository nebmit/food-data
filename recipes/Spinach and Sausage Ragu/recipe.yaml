schema_version: 2

meta:
  description: "A rich, hearty pasta ragu with pork sausage, wilted spinach, and a splash of milk for creaminess."
  source: "Original"
  cuisine: "Italian"

portion:
  quantity: 4
  descriptor: "servings"
  active_time_minutes: 30
  passive_time_minutes: 20
  complexity_rating: 2
  mayhem_rating: 2

items:
- name: Large pot
  quantity: 1
- name: Large frying pan
  quantity: 1

tables:
- name: Pasta
  stages:
  - id: pasta_water
    inputs:
    - ingredient: Water
      hint: "enough to boil the pasta"
    - ingredient: Salt
      hint: "enough to season the water"
    action: Bring to a boil

  - id: cooked_pasta
    inputs:
    - stage: pasta_water
    - ingredient: Rigatoni pasta
      quantity: 350
      measurement: grams
    action: Cook and drain
    hint: "until al dente; follow package timing"

- name: Ragu
  stages:
  - id: browned_sausage
    inputs:
    - ingredient: Olive oil
      quantity: 15
      measurement: ml
    - ingredient: Pork sausage
      quantity: 4
      measurement: unit
      hint: "casings removed; meat crumbled"
    - ingredient: Onion
      quantity: 1
      measurement: unit
      hint: "diced"
    action: Brown together
    hint: "medium heat; until sausage is browned and onion is soft"

  - id: seasoned_sausage
    inputs:
    - stage: browned_sausage
    - ingredient: Garlic
      quantity: 2
      measurement: clove
      hint: "finely chopped"
    - ingredient: Rosemary
      quantity: 2
      measurement: teaspoon
      hint: "finely chopped"
    - ingredient: Chili flakes
      quantity: 1
      measurement: teaspoon
    action: Cook
    hint: "1 min; until fragrant"
    duration_minutes: 1

  - id: tomato_ragu
    inputs:
    - stage: seasoned_sausage
    - ingredient: Chopped tomatoes
      quantity: 1
      measurement: can
    - ingredient: Water
      quantity: 100
      measurement: ml
    action: Simmer
    hint: "10 min; until thickened"
    duration_minutes: 10

  - id: creamy_ragu
    inputs:
    - stage: tomato_ragu
    - ingredient: Spinach
      quantity: 200
      measurement: grams
    - ingredient: Milk
      quantity: 150
      measurement: ml
    action: Stir in and cook
    hint: "about 2 min; until spinach wilts"
    duration_minutes: 2

- name: Assembly
  stages:
  - id: finished_ragu
    inputs:
    - stage: cooked_pasta
    - stage: creamy_ragu
    - ingredient: Salt
      hint: "to taste"
    action: Toss and season

note:
- "Use Italian-style sausages for the best flavour."
- "Finish with grated parmesan cheese on top."
- "Substitute spinach with kale for a slightly heartier dish."
