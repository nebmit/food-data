schema_version: 2

meta:
  description: "Colourful stir-fried egg noodles with fresh vegetables and a rich peanut sauce."
  source: "Original"
  cuisine: "Asian"

portion:
  quantity: 4
  descriptor: "servings"
  active_time_minutes: 30
  passive_time_minutes: 10
  complexity_rating: 2
  mayhem_rating: 1

tags:
- "Vegetarian"

tables:
- name: Sauce
  stages:
  - id: mix_peanut_sauce
    inputs:
    - ingredient: Vegetable stock
      quantity: 200
      measurement: ml
    - ingredient: Soy sauce
      quantity: 1
      measurement: tablespoon
    - ingredient: Palm sugar
      quantity: 1
      measurement: tablespoon
      hint: "or brown sugar"
    - ingredient: Peanut butter
      quantity: 2
      measurement: tablespoon
    - ingredient: Red chili
      quantity: 1
      measurement: unit
      hint: "finely sliced"
    action: Whisk

- name: Noodles
  stages:
  - id: heat_nut_oil
    inputs:
    - ingredient: Nut oil
      quantity: 2
      measurement: tablespoon
    action: Heat
    hint: "medium-high heat"
  - id: stir_fry_firm_vegetables
    inputs:
    - stage: heat_nut_oil
    - ingredient: Bell pepper
      quantity: 2
      measurement: unit
      hint: "sliced"
    - ingredient: Broccoli
      quantity: 1
      measurement: unit
      hint: "cut into small florets"
    - ingredient: Shallot
      quantity: 1
      measurement: unit
      hint: "finely sliced"
    - ingredient: Garlic
      quantity: 1
      measurement: clove
      hint: "minced"
    action: Stir-fry
    hint: "2 minutes"
  - id: stir_fry_remaining_vegetables
    inputs:
    - stage: stir_fry_firm_vegetables
    - ingredient: Carrot
      quantity: 1
      measurement: unit
      hint: "peeled into ribbons"
    - ingredient: Edamame beans
      quantity: 200
      measurement: grams
    action: Stir-fry
    hint: "3 minutes"
  - id: combine_rainbow_noodles
    inputs:
    - stage: stir_fry_remaining_vegetables
    - stage: mix_peanut_sauce
    - ingredient: Egg noodles
      quantity: 500
      measurement: grams
    - ingredient: Rainbow chard
      quantity: 1
      measurement: bunch
      hint: "roughly chopped"
    action: Toss
    hint: "until evenly coated"
  - id: cook_rainbow_noodles
    inputs:
    - stage: combine_rainbow_noodles
    action: Cook
    hint: "4–5 minutes; until the noodles are heated through and the chard has wilted"

items:
- name: Large frying pan
  quantity: 1

note:
- "Add prawns or chicken for extra protein."
- "Top with crushed peanuts and a squeeze of lime juice before serving."
