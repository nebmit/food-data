schema_version: 2

meta:
  description: "Easy festive chocolate bark with a dark and white chocolate swirl, topped with pistachios and cranberries."
  source: "Original"
  course: "Dessert"
  cuisine: "American"

portion:
  quantity: 10
  descriptor: "pieces"
  active_time_minutes: 30
  passive_time_minutes: 120
  complexity_rating: 2
  mayhem_rating: 1

tags:
- "Vegetarian"

items:
- name: Baking tray
  quantity: 1
- name: Heatproof bowl
  quantity: 2
- name: Pot
  quantity: 1

tables:
- name: Dark chocolate
  stages:
  - id: line_tray
    setup: true
    action: Line tray
    hint: "with parchment paper"

  - id: melt_dark_chocolate
    inputs:
    - ingredient: Dark chocolate
      quantity: 300
      measurement: grams
      hint: "roughly chopped"
    action: Melt
    hint: "in a heatproof bowl over barely simmering water; stir until smooth"

  - id: spread_dark_chocolate
    inputs:
    - stage: melt_dark_chocolate
    action: Spread
    hint: "on the lined tray; about 5 mm thick"

- name: White chocolate
  stages:
  - id: melt_white_chocolate
    inputs:
    - ingredient: White chocolate
      quantity: 150
      measurement: grams
      hint: "roughly chopped"
    action: Melt
    hint: "in the second bowl over the same pot; stir until smooth"

- name: Assembly
  stages:
  - id: swirl_chocolate
    inputs:
    - stage: spread_dark_chocolate
    - stage: melt_white_chocolate
    action: Swirl
    hint: "drizzle the white chocolate over the dark layer; marble with a skewer or knife"

  - id: top_chocolate_bark
    inputs:
    - stage: swirl_chocolate
    - ingredient: Pistachios
      quantity: 75
      measurement: grams
      hint: "shelled and roughly chopped; or any other nut"
    - ingredient: Dried cranberries
      quantity: 75
      measurement: grams
      hint: "or any other dried fruit"
    action: Scatter
    hint: "evenly over the surface; press in lightly"

  - id: chill_chocolate_bark
    inputs:
    - stage: top_chocolate_bark
    action: Chill
    hint: "refrigerate 1–2 hours; until fully set"
    duration_minutes: 120

  - id: break_chocolate_bark
    inputs:
    - stage: chill_chocolate_bark
    action: Break
    hint: "into irregular pieces"

note:
- "Any toppings work: seeds, crushed candy canes, or pretzels are all good."
- "Store in an airtight container in the fridge for up to 2 weeks."
