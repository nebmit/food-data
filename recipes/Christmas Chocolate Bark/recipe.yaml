schema_version: 2

meta:
  description: "Easy festive chocolate bark with a dark and white chocolate swirl, topped with your favourite toppings."
  source: "Original"
  cuisine: "American"

portion:
  quantity: 10
  descriptor: "pieces"
  active_time_minutes: 30
  passive_time_minutes: 120
  complexity_rating: 2
  mayhem_rating: 1

tags:
- "Dessert"
- "Vegetarian"

items:
- name: Oven tray
  quantity: 1
- name: Heatproof bowl
  quantity: 2
- name: Pot
  quantity: 1

tables:
- name: Dark chocolate
  stages:
  - id: line_bark_tray
    setup: true
    action: Line
    hint: "cover an oven tray with parchment paper"
  - id: melt_dark_chocolate
    inputs:
    - ingredient: Dark chocolate
      quantity: 300
      measurement: grams
      hint: "roughly chopped"
    action: Melt
    hint: "stir occasionally in a heatproof bowl over gently simmering bain-marie water"
  - id: spread_dark_chocolate
    inputs:
    - stage: melt_dark_chocolate
    action: Spread
    hint: "on the lined tray, about 1 cm thick"

- name: White chocolate
  stages:
  - id: melt_white_chocolate
    inputs:
    - ingredient: White chocolate
      quantity: 150
      measurement: grams
      hint: "roughly chopped"
    action: Melt
    hint: "use a separate heatproof bowl over the same bain-marie water"

- name: Assembly
  stages:
  - id: swirl_chocolate
    inputs:
    - stage: spread_dark_chocolate
    - stage: melt_white_chocolate
    action: Swirl
    hint: "drizzle the white chocolate over the dark layer; marble with a skewer or knife"
  - id: top_chocolate_bark
    inputs:
    - stage: swirl_chocolate
    - ingredient: Toppings
      quantity: 200
      measurement: grams
      hint: "nuts, seeds, dried fruit, crushed candy, or pretzels"
    action: Scatter
    hint: "evenly over the surface"
  - id: chill_chocolate_bark
    inputs:
    - stage: top_chocolate_bark
    action: Chill
    hint: "refrigerate for 1–2 hours until fully set"
  - id: break_chocolate_bark
    inputs:
    - stage: chill_chocolate_bark
    action: Break
    hint: "into irregular pieces"
  - id: serve_chocolate_bark
    inputs:
    - stage: break_chocolate_bark
    action: Serve

note:
- "Use any toppings you like — crushed candy canes and pistachios are great for Christmas."
- "Store in an airtight container in a cool place for up to 2 weeks."
