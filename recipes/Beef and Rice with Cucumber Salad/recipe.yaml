schema_version: 2

meta:
  description: "Spiced ground beef served over buttery rice with a cool cucumber yogurt salad on the side."
  source: "Original"
  course: "Main"
  cuisine: "North African"

portion:
  quantity: 4
  descriptor: "servings"
  active_time_minutes: 30
  passive_time_minutes: 15
  complexity_rating: 2
  mayhem_rating: 1

items:
- name: Small pot
  quantity: 1
- name: Large frying pan
  quantity: 1

tables:
- name: Dill
  stages:
  - id: separate_dill
    inputs:
    - ingredient: Dill
      quantity: 10
      measurement: grams
    action: Separate
    hint: "pick the tips and chop most of them; keep the stems and a few tips whole"

- name: Rice
  stages:
  - id: cook_rice
    inputs:
    - ingredient: Water
      quantity: 800
      measurement: ml
    - ingredient: Rice
      quantity: 400
      measurement: grams
    - ingredient: Salt
      quantity: 1
      measurement: pinch
    action: Cook
    hint: "bring to a boil, then cover; lowest heat; 12–15 min; until tender"
    duration_minutes: 15

  - id: butter_rice
    inputs:
    - stage: cook_rice
    - ingredient: Butter
      quantity: 30
      measurement: grams
    action: Stir
    hint: "until the rice is coated"

- name: Beef
  stages:
  - id: brown_beef
    inputs:
    - ingredient: Olive oil
      quantity: 25
      measurement: ml
    - ingredient: Ground beef
      quantity: 500
      measurement: grams
    action: Brown
    hint: "medium-high heat; 5–6 min; break up the meat"
    duration_minutes: 6

  - id: soften_beef_vegetables
    inputs:
    - stage: brown_beef
    - ingredient: Red onion
      quantity: 1.5
      measurement: unit
      hint: "diced"
    - ingredient: Green bell pepper
      quantity: 2
      measurement: unit
      hint: "seeded and cut into 2 cm cubes"
    - ingredient: North african spice mix
      quantity: 2
      measurement: packet
      hint: "or ras el hanout"
    action: Cook
    hint: "3–4 min; until the onion softens"
    duration_minutes: 4

  - id: simmer_beef
    inputs:
    - stage: soften_beef_vegetables
    - stage: separate_dill
      part: "stems"
    - ingredient: Tomato
      quantity: 4
      measurement: unit
      hint: "diced"
    - ingredient: Tomato paste
      quantity: 2
      measurement: tablespoon
    - ingredient: Water
      quantity: 150
      measurement: ml
      hint: "plus more if needed"
    action: Simmer
    hint: "medium heat; 10–15 min"
    duration_minutes: 15

  - id: season_beef
    inputs:
    - stage: simmer_beef
    - ingredient: Salt
      hint: "to taste"
    - ingredient: Pepper
      hint: "to taste"
    action: Season
    hint: "fish out the dill stems"

- name: Cucumber salad
  stages:
  - id: make_yogurt_dressing
    inputs:
    - stage: separate_dill
      part: "chopped tips"
    - ingredient: Yogurt
      quantity: 500
      measurement: grams
    - ingredient: Mint
      quantity: 10
      measurement: grams
      hint: "leaves picked and finely chopped"
    - ingredient: Garlic
      quantity: 2
      measurement: clove
      hint: "peeled and finely minced"
    - ingredient: Olive oil
      quantity: 25
      measurement: ml
    - ingredient: Vinegar
      quantity: 15
      measurement: ml
    - ingredient: Salt
      hint: "to taste"
    - ingredient: Pepper
      hint: "to taste"
    action: Mix

  - id: toss_cucumber_salad
    inputs:
    - stage: make_yogurt_dressing
    - ingredient: Cucumber
      quantity: 2
      measurement: unit
      hint: "sliced"
    - ingredient: Red onion
      quantity: 0.5
      measurement: unit
      hint: "diced"
    action: Toss

- name: Assembly
  stages:
  - id: assemble_beef_rice_salad
    inputs:
    - stage: butter_rice
    - stage: season_beef
    - stage: toss_cucumber_salad
    - stage: separate_dill
      part: "reserved tips"
    action: Assemble
    hint: "beef over rice, dill on top, and salad alongside"

note:
- "The cucumber salad can be made ahead and chilled for a fresher taste."
- "Substitute yogurt with coconut yogurt for a dairy-free version."
