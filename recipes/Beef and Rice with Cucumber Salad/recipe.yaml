schema_version: 2

meta:
  description: "Spiced ground beef served over buttery rice with a cool cucumber yogurt salad on the side."
  source: "Original"
  cuisine: "North African"

portion:
  quantity: 4
  descriptor: "servings"
  active_time_minutes: 30
  passive_time_minutes: 15
  complexity_rating: 2
  mayhem_rating: 1

items:
- name: Small pot
  quantity: 1
- name: Large frying pan
  quantity: 1

tables:
- name: Dill
  stages:
  - id: separate_dill
    inputs:
    - ingredient: Dill
      quantity: 10
      measurement: grams
      hint: "tips picked, stems reserved"
    action: Separate
    hint: "chop most of the tips; keep the stems and a few tips whole"

- name: Rice
  stages:
  - id: boil_rice_water
    inputs:
    - ingredient: Water
      quantity: 800
      measurement: ml
    action: Boil
  - id: cook_rice
    inputs:
    - stage: boil_rice_water
    - ingredient: Rice
      quantity: 400
      measurement: grams
    action: Cook
    hint: "covered, until tender"
  - id: butter_rice
    inputs:
    - stage: cook_rice
    - ingredient: Butter
      quantity: 30
      measurement: grams
    action: Stir
    hint: "coat the rice with butter"

- name: Beef
  stages:
  - id: heat_beef_oil
    inputs:
    - ingredient: Olive oil
      quantity: 25
      measurement: ml
    action: Heat
    hint: "medium-high heat"
  - id: brown_beef
    inputs:
    - stage: heat_beef_oil
    - ingredient: Ground beef
      quantity: 500
      measurement: grams
    - ingredient: Red onion
      quantity: 1.5
      measurement: unit
      hint: "diced"
    - ingredient: Green bell pepper
      quantity: 2
      measurement: unit
      hint: "seeded and cut into 2 cm cubes"
    - ingredient: North african spice mix
      quantity: 2
      measurement: packet
      hint: "or ras el hanout"
    action: Brown
    hint: "medium-high heat, 3–4 min"
    duration_minutes: 4
  - id: simmer_beef
    inputs:
    - stage: brown_beef
    - stage: separate_dill
      part: "stems"
    - ingredient: Tomato
      quantity: 4
      measurement: unit
      hint: "diced"
    - ingredient: Tomato paste
      quantity: 2
      measurement: can
    - ingredient: Water
      quantity: 150
      measurement: ml
      hint: "plus more if needed"
    action: Simmer
    hint: "medium heat, 10–15 min"
    duration_minutes: 15
  - id: season_beef
    inputs:
    - stage: simmer_beef
    - ingredient: Salt
      hint: "to taste"
    - ingredient: Pepper
      hint: "to taste"
    action: Season

- name: Cucumber salad
  stages:
  - id: make_yogurt_dressing
    inputs:
    - stage: separate_dill
      part: "chopped tips"
    - ingredient: Yogurt
      quantity: 500
      measurement: grams
    - ingredient: Mint
      quantity: 10
      measurement: grams
      hint: "leaves picked and finely chopped"
    - ingredient: Garlic
      quantity: 2
      measurement: clove
      hint: "peeled and finely minced"
    - ingredient: Olive oil
      quantity: 25
      measurement: ml
    - ingredient: Vinegar
      quantity: 60
      measurement: ml
    - ingredient: Salt
      hint: "to taste"
    - ingredient: Pepper
      hint: "to taste"
    action: Mix
  - id: toss_cucumber_salad
    inputs:
    - stage: make_yogurt_dressing
    - ingredient: Cucumber
      quantity: 2
      measurement: unit
      hint: "sliced"
    - ingredient: Red onion
      quantity: 0.5
      measurement: unit
      hint: "diced"
    action: Toss

- name: Assembly
  stages:
  - id: assemble_beef_rice_salad
    inputs:
    - stage: butter_rice
    - stage: season_beef
    - stage: toss_cucumber_salad
    - stage: separate_dill
      part: "reserved tips"
    action: Assemble
    hint: "beef over rice, dill on top, and salad alongside"

note:
- "The cucumber salad can be made ahead and chilled for a fresher taste."
- "Substitute yogurt with coconut yogurt for a dairy-free version."
