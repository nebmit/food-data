schema_version: 2

meta:
  description: "Classic chocolate chip cookies with crispy edges and chewy centres."
  source: "Original"
  course: "Dessert"
  cuisine: "American"

portion:
  quantity: 24
  descriptor: "cookies"
  active_time_minutes: 20
  passive_time_minutes: 25
  complexity_rating: 2
  mayhem_rating: 2

tags:
- "Vegetarian"
- "Baking"

items:
- name: Oven
  quantity: 1
- name: Mixing bowl
  quantity: 1
- name: Baking tray
  quantity: 2

tables:
- name: Dough
  stages:
  - id: preheat_oven
    setup: true
    action: Preheat oven
    hint: "190°C"

  - id: line_trays
    setup: true
    action: Line trays
    hint: "with parchment paper"

  - id: cream_cookie_base
    inputs:
    - ingredient: Butter
      quantity: 170
      measurement: grams
      hint: "softened; or margarine"
    - ingredient: Brown sugar
      quantity: 200
      measurement: grams
    - ingredient: Sugar
      quantity: 100
      measurement: grams
    action: Cream
    hint: "until light and fluffy"

  - id: beat_cookie_egg
    inputs:
    - stage: cream_cookie_base
    - ingredient: Egg
      quantity: 1
      measurement: unit
    - ingredient: Vanilla extract
      quantity: 1
      measurement: teaspoon
    action: Beat

  - id: mix_cookie_dough
    inputs:
    - stage: beat_cookie_egg
    - ingredient: Flour
      quantity: 270
      measurement: grams
    - ingredient: Baking powder
      quantity: 1
      measurement: teaspoon
    - ingredient: Salt
      quantity: 1
      measurement: pinch
    action: Mix
    hint: "until just combined"

  - id: add_chocolate_chips
    inputs:
    - stage: mix_cookie_dough
    - ingredient: Chocolate chips
      quantity: 350
      measurement: grams
    action: Fold

- name: Bake
  stages:
  - id: shape_cookies
    inputs:
    - stage: add_chocolate_chips
    action: Shape
    hint: "roughly 45 g balls; well spaced on the lined trays"

  - id: bake_cookies
    inputs:
    - stage: shape_cookies
    action: Bake
    hint: "one tray at a time; 9–10 min per tray; until the edges are golden and the centres still soft"
    duration_minutes: 10

  - id: cool_cookies
    inputs:
    - stage: bake_cookies
    action: Cool
    hint: "on the tray; 5 min"
    duration_minutes: 5

note:
- "Substitute chocolate chips with chopped nuts or dried fruit."
- "The cookies look underdone when they come out; they firm up as they cool on the tray."
