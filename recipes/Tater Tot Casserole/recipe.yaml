schema_version: 2

meta:
  description: "Hearty Midwestern casserole with seasoned ground beef, melted cheddar, and crispy tater tots baked until golden."
  source: "The Official Overwatch Cookbook by Chelsea Monroe-Cassel"
  cuisine: "American"

portion:
  quantity: 6
  descriptor: "servings"
  active_time_minutes: 15
  passive_time_minutes: 35
  complexity_rating: 2
  mayhem_rating: 2

tags:
- "Gluten-free"
- "Comfort food"
- "Casserole"
- "Dinner"

items:
- name: Oven
  quantity: 1
- name: Casserole dish
  quantity: 1
- name: Large frying pan
  quantity: 1

tables:
- name: Filling
  stages:
  - id: hot_oil
    inputs:
    - ingredient: Olive oil
      quantity: 30
      measurement: ml
    action: Heat
    hint: "medium heat"

  - id: cooked_garlic
    inputs:
    - stage: hot_oil
    - ingredient: Garlic
      quantity: 2
      measurement: clove
      hint: "minced"
    action: Cook
    hint: "several min; until golden and fragrant"

  - id: browned_beef
    inputs:
    - stage: cooked_garlic
    - ingredient: Ground beef
      quantity: 680
      measurement: grams
    action: Brown
    hint: "break up the meat; cook completely"

  - id: seasoned_filling
    inputs:
    - stage: browned_beef
    - ingredient: Dark brown sugar
      quantity: 60
      measurement: ml
    - ingredient: Tomato paste
      quantity: 30
      measurement: ml
    - ingredient: Worcestershire sauce
      quantity: 15
      measurement: ml
    - ingredient: Dried savory
      quantity: 0.5
      measurement: teaspoon
      hint: "or dried thyme"
    - ingredient: Mixed frozen vegetables
      quantity: 240
      measurement: ml
    - ingredient: Salt
      hint: "to taste"
    - ingredient: Pepper
      hint: "to taste"
    action: Stir and season
    hint: "combine thoroughly"

  - id: filling_in_dish
    inputs:
    - stage: seasoned_filling
    action: Transfer to casserole dish
    hint: "20 × 28 cm"

- name: Bake
  stages:
  - id: preheat_oven
    setup: true
    action: Preheat oven
    hint: "218°C"

  - id: cheese_layer
    inputs:
    - stage: filling_in_dish
    - ingredient: Cheddar cheese
      quantity: 360
      measurement: ml
      hint: "shredded"
    action: Top evenly

  - id: tater_tot_layer
    inputs:
    - stage: cheese_layer
    - ingredient: Frozen tater tots
      quantity: 907
      measurement: grams
    action: Arrange on top
    hint: "in even rows"

  - id: baked_casserole
    inputs:
    - stage: tater_tot_layer
    action: Bake
    hint: "30 min; until tater tots are crispy"
    duration_minutes: 30

  - id: broiled_casserole
    inputs:
    - stage: baked_casserole
    action: Broil if desired
    hint: "2–3 min; watch closely to prevent burning"
    duration_minutes: 3

  - id: finish_casserole
    inputs:
    - stage: broiled_casserole
    action: Serve hot
    hint: "with ketchup or preferred condiments"

note:
- "Dried thyme can be substituted for dried savory if unavailable."
- "Soy sauce is a surprisingly good condiment pairing."
- "This recipe is gluten-free as written, but check tater tot packaging to confirm."
- "Ground turkey can be used in place of ground beef for a lighter version."
