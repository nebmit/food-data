schema_version: 2

meta:
  description: "Hearty Midwestern casserole with seasoned ground beef, melted cheddar, and crispy tater tots baked until golden."
  source: "The Official Overwatch Cookbook by Chelsea Monroe-Cassel"
  course: "Main"
  cuisine: "American"

portion:
  quantity: 6
  descriptor: "servings"
  active_time_minutes: 15
  passive_time_minutes: 35
  complexity_rating: 2
  mayhem_rating: 2

tags:
- "Gluten-free"
- "Comfort food"
- "Casserole"

items:
- name: Oven
  quantity: 1
- name: Casserole dish
  quantity: 1
- name: Large frying pan
  quantity: 1

tables:
- name: Filling
  stages:
  - id: preheat_oven
    setup: true
    action: Preheat oven
    hint: "220°C"

  - id: brown_beef
    inputs:
    - ingredient: Olive oil
      quantity: 15
      measurement: ml
    - ingredient: Ground beef
      quantity: 700
      measurement: grams
    action: Brown
    hint: "medium-high heat; break up the meat; until no pink remains"

  - id: season_filling
    inputs:
    - stage: brown_beef
    - ingredient: Garlic
      quantity: 2
      measurement: clove
      hint: "minced"
    - ingredient: Brown sugar
      quantity: 50
      measurement: grams
      hint: "dark"
    - ingredient: Tomato paste
      quantity: 2
      measurement: tablespoon
    - ingredient: Worcestershire sauce
      quantity: 15
      measurement: ml
    - ingredient: Dried savory
      quantity: 0.5
      measurement: teaspoon
      hint: "or dried thyme"
    - ingredient: Mixed frozen vegetables
      quantity: 150
      measurement: grams
    - ingredient: Salt
      hint: "to taste"
    - ingredient: Pepper
      hint: "to taste"
    action: Stir
    hint: "medium heat; until the garlic is fragrant and everything is combined"

  - id: fill_casserole_dish
    inputs:
    - stage: season_filling
    action: Transfer
    hint: "to a casserole dish of about 20 × 28 cm"

- name: Bake
  stages:
  - id: layer_casserole
    inputs:
    - stage: fill_casserole_dish
    - ingredient: Cheddar cheese
      quantity: 170
      measurement: grams
      hint: "shredded"
    - ingredient: Frozen tater tots
      quantity: 900
      measurement: grams
    action: Layer
    hint: "cheese first, then the tater tots in even rows"

  - id: bake_casserole
    inputs:
    - stage: layer_casserole
    action: Bake
    hint: "30 min; until the tater tots are crisp; broil for the last 2–3 min for extra colour"
    duration_minutes: 30

note:
- "Serve hot with ketchup; soy sauce is a surprisingly good condiment pairing too."
- "Watch closely if you broil at the end — the tater tots go from golden to burnt quickly."
- "This recipe is gluten-free as written, but check tater tot packaging to confirm."
- "Ground turkey can be used in place of ground beef for a lighter version."
