schema_version: 2

meta:
  description: "A quick weeknight stir-fry with tender chicken, scrambled eggs, and crisp vegetables over rice."
  source: "Original"
  cuisine: "Chinese"

portion:
  quantity: 4
  descriptor: "servings"
  active_time_minutes: 30
  passive_time_minutes: 0
  complexity_rating: 2
  mayhem_rating: 1

items:
- name: Pot
  quantity: 1
- name: Wok
  quantity: 1
  sub: "or large frying pan"

tables:
- name: Rice
  stages:
  - id: cook_fried_rice_rice
    inputs:
    - ingredient: Rice
      quantity: 400
      measurement: grams
    - ingredient: Water
      hint: "as directed on the rice package"
    action: Cook
    hint: "follow the package instructions; set aside"

- name: Chicken
  stages:
  - id: cook_chicken
    inputs:
    - ingredient: Vegetable oil
      quantity: 15
      measurement: ml
    - ingredient: Chicken breast
      quantity: 400
      measurement: grams
      hint: "cut into 2 cm cubes"
    - ingredient: Salt
      hint: "to taste"
    - ingredient: Pepper
      hint: "to taste"
    action: Cook
    hint: "medium-high heat until no longer pink; remove and set aside"

- name: Fried rice
  stages:
  - id: saute_vegetables
    inputs:
    - ingredient: Vegetable oil
      quantity: 15
      measurement: ml
    - ingredient: Garlic
      quantity: 8
      measurement: clove
      hint: "minced"
    - ingredient: Carrot
      quantity: 2
      measurement: unit
      hint: "diced"
    - ingredient: Bell pepper
      quantity: 2
      measurement: unit
      hint: "diced"
    action: Sauté
    hint: "medium-high heat, 2–3 min"
    duration_minutes: 3
  - id: cook_peas
    inputs:
    - stage: saute_vegetables
    - ingredient: Frozen peas
      quantity: 200
      measurement: grams
    action: Cook
    hint: "2 min"
    duration_minutes: 2
  - id: scramble_eggs
    inputs:
    - stage: cook_peas
    - ingredient: Egg
      quantity: 4
      measurement: unit
    action: Scramble
    hint: "push the vegetables to one side and cook the eggs on the other"
  - id: mix_fried_rice
    inputs:
    - stage: scramble_eggs
    - stage: cook_fried_rice_rice
    action: Mix
  - id: finish_fried_rice
    inputs:
    - stage: mix_fried_rice
    - stage: cook_chicken
    - ingredient: Soy sauce
      quantity: 120
      measurement: ml
    action: Stir-fry
    hint: "2–3 min"
    duration_minutes: 3

note:
- "Use day-old rice for the best fried rice texture."
- "Add a splash of sesame oil at the end for extra flavour."
- "Substitute chicken with tofu for a vegetarian version."
