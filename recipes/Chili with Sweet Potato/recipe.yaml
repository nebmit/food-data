schema_version: 2

meta:
  description: "A hearty vegetarian chili loaded with sweet potato, two kinds of beans, and warm spices."
  source: "Original"
  cuisine: "Mexican"

portion:
  quantity: 4
  descriptor: "servings"
  active_time_minutes: 60
  passive_time_minutes: 15
  complexity_rating: 3
  mayhem_rating: 2

tags:
- "Mexican"
- "Vegetarian"

items:
- name: Large pot
  quantity: 1

tables:
- name: Chili
  stages:
  - id: soften_aromatics
    inputs:
    - ingredient: Olive oil
      quantity: 15
      measurement: ml
    - ingredient: Onion
      quantity: 150
      measurement: grams
      hint: "diced"
    - ingredient: Garlic
      quantity: 4
      measurement: clove
      hint: "minced"
    action: Cook
    hint: "medium heat, about 5 min until soft"
    duration_minutes: 5
  - id: soften_bell_pepper
    inputs:
    - stage: soften_aromatics
    - ingredient: Bell pepper
      quantity: 200
      measurement: grams
      hint: "diced"
    action: Cook
    hint: "5 min until starting to soften"
    duration_minutes: 5
  - id: combine_chili
    inputs:
    - stage: soften_bell_pepper
    - ingredient: Sweet potato
      quantity: 500
      measurement: grams
      hint: "peeled and cubed"
    - ingredient: Black beans
      quantity: 400
      measurement: grams
      hint: "drained and rinsed"
    - ingredient: Kidney beans
      quantity: 400
      measurement: grams
      hint: "drained and rinsed"
    - ingredient: Diced tomatoes
      quantity: 800
      measurement: grams
      hint: "or 2 cans of chopped tomatoes"
    - ingredient: Chili powder
      quantity: 2
      measurement: tablespoon
    - ingredient: Cumin
      quantity: 1
      measurement: tablespoon
    - ingredient: Smoked paprika
      quantity: 1
      measurement: tablespoon
    - ingredient: Salt
      hint: "to taste"
    - ingredient: Pepper
      hint: "to taste"
    action: Stir
  - id: boil_chili
    inputs:
    - stage: combine_chili
    action: Boil
  - id: simmer_chili
    inputs:
    - stage: boil_chili
    action: Simmer
    hint: "reduce the heat; about 30 min until the sweet potato is tender"
    duration_minutes: 30
  - id: garnish_chili
    inputs:
    - stage: simmer_chili
    - ingredient: Avocado
      quantity: 1
      measurement: unit
      hint: "sliced"
    - ingredient: Cilantro
      quantity: 30
      measurement: grams
      hint: "roughly chopped"
    - ingredient: Shredded cheese
      quantity: 100
      measurement: grams
    action: Garnish
  - id: serve_chili
    inputs:
    - stage: garnish_chili
    action: Serve
    hint: "divide among bowls"

note:
- "Add a squeeze of lime juice for extra brightness."
- "For a vegan version, skip the cheese or use a plant-based alternative."
- "Leftovers freeze well for up to 3 months."
