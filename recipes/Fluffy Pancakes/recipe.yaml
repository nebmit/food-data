schema_version: 2

meta:
  description: "Light and airy Japanese-style souffle pancakes made with whipped egg whites."
  source: "Original"
  course: "Breakfast"
  cuisine: "Japanese"

portion:
  quantity: 4
  descriptor: "servings"
  active_time_minutes: 40
  passive_time_minutes: 0
  complexity_rating: 2
  mayhem_rating: 2

tags:
- "Vegetarian"

items:
- name: Mixing bowl
  quantity: 2
- name: Non-stick pan
  quantity: 1
- name: Lid
  quantity: 1

tables:
- name: Batter
  stages:
  - id: separate_eggs
    inputs:
    - ingredient: Egg
      quantity: 8
      measurement: unit
    action: Separate
    hint: "put the whites in a clean, dry bowl"

  - id: whip_egg_whites
    inputs:
    - stage: separate_eggs
      part: "whites"
    - ingredient: Sugar
      quantity: 40
      measurement: grams
    action: Beat
    hint: "to stiff peaks"

  - id: whisk_yolk_batter
    inputs:
    - stage: separate_eggs
      part: "yolks"
    - ingredient: Milk
      quantity: 80
      measurement: ml
    - ingredient: Sugar
      quantity: 40
      measurement: grams
    - ingredient: Flour
      quantity: 120
      measurement: grams
    - ingredient: Vanilla extract
      quantity: 2
      measurement: teaspoon
    action: Whisk
    hint: "in a separate bowl; until smooth"

  - id: fold_pancake_batter
    inputs:
    - stage: whisk_yolk_batter
    - stage: whip_egg_whites
    action: Fold
    hint: "add the whites in three batches without deflating them"

- name: Cook
  stages:
  - id: preheat_pan
    setup: true
    action: Preheat pan
    hint: "lowest heat setting"

  - id: portion_pancakes
    inputs:
    - stage: fold_pancake_batter
    - ingredient: Vegetable oil
      hint: "a thin film wiped over the pan"
    action: Spoon
    hint: "tall mounds; a few at a time, working in batches"

  - id: cook_first_pancake_side
    inputs:
    - stage: portion_pancakes
    action: Cook
    hint: "covered; lowest heat; 5–6 min per batch"
    duration_minutes: 6

  - id: flip_pancakes
    inputs:
    - stage: cook_first_pancake_side
    action: Flip
    hint: "turn carefully"

  - id: finish_pancakes
    inputs:
    - stage: flip_pancakes
    action: Cook
    hint: "covered; lowest heat; 5–6 min per batch; until golden and cooked through"
    duration_minutes: 6

note:
- "Serve with fresh fruit, whipped cream, maple syrup, or a dusting of icing sugar."
- "The key to fluffy pancakes is keeping the heat very low and not deflating the egg whites."
- "The batter does not keep; cook the batches back to back."
