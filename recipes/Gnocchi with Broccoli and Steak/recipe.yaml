schema_version: 2

meta:
  description: "Pan-fried gnocchi with tender-crisp broccoli and sliced sirloin steak in garlic butter."
  source: "Original"
  course: "Main"
  cuisine: "Italian"

portion:
  quantity: 4
  descriptor: "servings"
  active_time_minutes: 30
  passive_time_minutes: 5
  complexity_rating: 2
  mayhem_rating: 1

items:
- name: Large frying pan
  quantity: 1
- name: Lid
  quantity: 1

tables:
- name: Steak
  stages:
  - id: sear_steak
    inputs:
    - ingredient: Sirloin steak
      quantity: 400
      measurement: grams
    - ingredient: Olive oil
      quantity: 15
      measurement: ml
    - ingredient: Salt
      hint: "to taste"
    - ingredient: Pepper
      hint: "to taste"
    action: Sear
    hint: "high heat; 2–3 min per side for medium-rare"
    duration_minutes: 3

  - id: rest_steak
    inputs:
    - stage: sear_steak
    action: Rest
    hint: "5 min"
    duration_minutes: 5

  - id: slice_steak
    inputs:
    - stage: rest_steak
    action: Slice
    hint: "against the grain"

- name: Gnocchi
  stages:
  - id: brown_gnocchi
    inputs:
    - ingredient: Butter
      quantity: 50
      measurement: grams
    - ingredient: Potato gnocchi
      quantity: 500
      measurement: grams
    action: Pan-fry
    hint: "medium heat; 5–6 min; until golden on all sides"
    duration_minutes: 6

  - id: cook_broccoli
    inputs:
    - stage: brown_gnocchi
    - ingredient: Garlic
      quantity: 2
      measurement: clove
      hint: "thinly sliced"
    - ingredient: Broccoli
      quantity: 300
      measurement: grams
      hint: "cut into small florets"
    - ingredient: Water
      quantity: 50
      measurement: ml
    action: Steam
    hint: "covered; 3–4 min; until the broccoli is tender-crisp and the water has cooked off"
    duration_minutes: 4

- name: Assembly
  stages:
  - id: assemble_gnocchi
    inputs:
    - stage: slice_steak
    - stage: cook_broccoli
    - ingredient: Parmesan cheese
      quantity: 50
      measurement: grams
      hint: "grated"
    - ingredient: Salt
      hint: "to taste"
    - ingredient: Pepper
      hint: "to taste"
    action: Assemble
    hint: "season the gnocchi and broccoli; top with steak and parmesan"

note:
- "Cook the gnocchi in the steak pan while the steak rests; the browned bits flavour the butter."
- "Substitute steak with chicken breast for a lighter option."
