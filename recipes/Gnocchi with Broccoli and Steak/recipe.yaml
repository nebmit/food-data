schema_version: 2

meta:
  description: "Pan-fried gnocchi with tender broccoli and sliced sirloin steak in a buttery garlic sauce."
  source: "Original"
  cuisine: "Italian"

portion:
  quantity: 4
  descriptor: "servings"
  active_time_minutes: 30
  passive_time_minutes: 15
  complexity_rating: 2
  mayhem_rating: 1

tables:
- name: Steak
  stages:
  - id: sear_steak
    inputs:
    - ingredient: Sirloin steak
      quantity: 400
      measurement: grams
    - ingredient: Olive oil
      quantity: 15
      measurement: ml
    - ingredient: Salt
      hint: "to taste"
    - ingredient: Pepper
      hint: "to taste"
    action: Sear
    hint: "high heat; 2–3 minutes per side for medium-rare"
  - id: rest_steak
    inputs:
    - stage: sear_steak
    action: Rest
    hint: "5 minutes"
  - id: slice_steak
    inputs:
    - stage: rest_steak
    action: Slice

- name: Gnocchi
  stages:
  - id: brown_gnocchi
    inputs:
    - ingredient: Butter
      quantity: 50
      measurement: grams
    - ingredient: Potato gnocchi
      quantity: 500
      measurement: grams
    action: Pan-fry
    hint: "medium heat; 5–6 minutes; until golden on all sides"
  - id: cook_broccoli
    inputs:
    - stage: brown_gnocchi
    - ingredient: Garlic
      quantity: 2
      measurement: clove
      hint: "thinly sliced"
    - ingredient: Broccoli
      quantity: 300
      measurement: grams
      hint: "cut into small florets"
    action: Cook
    hint: "3–4 minutes; until the broccoli is tender-crisp"

- name: Assembly
  stages:
  - id: assemble_gnocchi
    inputs:
    - stage: slice_steak
    - stage: cook_broccoli
    - ingredient: Parmesan cheese
      quantity: 50
      measurement: grams
      hint: "grated"
    - ingredient: Salt
      hint: "to taste"
    - ingredient: Pepper
      hint: "to taste"
    action: Assemble
    hint: "season the gnocchi and broccoli; top with steak and parmesan"

items:
- name: Large frying pan
  quantity: 1

note:
- "Let the steak rest before slicing to keep it juicy."
- "Substitute steak with chicken breast for a lighter option."
