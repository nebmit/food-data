schema_version: 2

meta:
  description: "Crisp golden fries tossed with garlic and freshly grated parmesan cheese."
  source: "Original"
  cuisine: "American"

portion:
  quantity: 4
  descriptor: "servings"
  active_time_minutes: 25
  passive_time_minutes: 0
  complexity_rating: 2
  mayhem_rating: 1

tables:
- name: Fries
  stages:
  - id: preheat_oven
    setup: true
    action: Preheat oven
    hint: "220°C; line a baking tray with parchment paper"
  - id: season_fries
    inputs:
    - ingredient: Potato
      quantity: 6
      measurement: unit
      hint: "cut into 1cm-thick fries"
    - ingredient: Olive oil
      quantity: 30
      measurement: ml
    - ingredient: Garlic
      quantity: 2
      measurement: clove
      hint: "minced"
    - ingredient: Salt
      quantity: 1
      measurement: pinch
    - ingredient: Pepper
      quantity: 1
      measurement: pinch
    action: Toss
    hint: "until evenly coated"
  - id: arrange_fries
    inputs:
    - stage: season_fries
    action: Spread
    hint: "in a single layer on the baking tray"
  - id: bake_fries
    inputs:
    - stage: arrange_fries
    action: Bake
    hint: "20–25 minutes; flip halfway; until golden and crisp"
    duration_minutes: 25
  - id: finish_fries
    inputs:
    - stage: bake_fries
    - ingredient: Parmesan cheese
      quantity: 50
      measurement: grams
      hint: "finely grated"
    action: Toss
    hint: "serve hot"

items:
- name: Oven
  quantity: 1
- name: Baking tray
  quantity: 1

note:
- "Soak the cut potatoes in cold water for 30 minutes before baking for extra crispiness."
- "Add a sprinkle of dried rosemary or smoked paprika for extra flavour."
