schema_version: 2

meta:
  description: "Rich, fudgy blondies loaded with white chocolate chips and a golden caramelised top."
  source: "Original"
  course: "Dessert"
  cuisine: "American"

portion:
  quantity: 16
  descriptor: "pieces"
  active_time_minutes: 40
  passive_time_minutes: 210
  complexity_rating: 2
  mayhem_rating: 2

tags:
- "Vegetarian"
- "Baking"

items:
- name: Oven
  quantity: 1
- name: Heatproof bowl
  quantity: 1
- name: Mixing bowl
  quantity: 1
- name: Baking tin
  quantity: 1

tables:
- name: Chocolate mixture
  stages:
  - id: preheat_oven
    setup: true
    action: Preheat oven
    hint: "180°C; 160°C fan"

  - id: line_tin
    setup: true
    action: Line tin
    hint: "a 20 cm square baking tin with parchment paper"

  - id: melt_chocolate
    inputs:
    - ingredient: Butter
      quantity: 175
      measurement: grams
    - ingredient: White chocolate
      quantity: 175
      measurement: grams
      hint: "roughly chopped"
    action: Melt
    hint: "in a heatproof bowl over simmering water; stir until smooth"

- name: Batter
  stages:
  - id: whisk_sugar_and_eggs
    inputs:
    - ingredient: Sugar
      quantity: 100
      measurement: grams
    - ingredient: Brown sugar
      quantity: 100
      measurement: grams
    - ingredient: Egg
      quantity: 3
      measurement: unit
    action: Whisk
    hint: "until combined"

  - id: stir_in_chocolate
    inputs:
    - stage: whisk_sugar_and_eggs
    - stage: melt_chocolate
    action: Stir
    hint: "until smooth"

  - id: fold_blondie_batter
    inputs:
    - stage: stir_in_chocolate
    - ingredient: Flour
      quantity: 175
      measurement: grams
    - ingredient: White chocolate chips
      quantity: 250
      measurement: grams
    action: Fold
    hint: "until just combined"

- name: Bake
  stages:
  - id: fill_tin
    inputs:
    - stage: fold_blondie_batter
    action: Pour
    hint: "into the lined tin; level the top"

  - id: bake_blondies
    inputs:
    - stage: fill_tin
    action: Bake
    hint: "22–27 min; until the centre has only the slightest wobble"
    duration_minutes: 27

  - id: cool_blondies
    inputs:
    - stage: bake_blondies
    action: Cool
    hint: "in the tin; until completely cool"

  - id: chill_blondies
    inputs:
    - stage: cool_blondies
    action: Chill
    hint: "refrigerate at least 2 hours; overnight for the fudgiest texture"
    duration_minutes: 120

note:
- "Drizzle with melted white chocolate for decoration."
- "Add dried cranberries or macadamia nuts for extra texture."
- "The blondies will firm up significantly as they cool and chill."
