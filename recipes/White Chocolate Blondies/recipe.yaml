schema_version: 2

meta:
  description: "Rich, fudgy blondies loaded with white chocolate chips and a golden caramelised top."
  source: "Original"
  cuisine: "American"

portion:
  quantity: 16
  descriptor: "pieces"
  active_time_minutes: 40
  passive_time_minutes: 120
  complexity_rating: 2
  mayhem_rating: 2

tags:
- "Vegetarian"
- "Dessert"
- "Baking"

items:
- name: Oven
  quantity: 1
- name: Heatproof bowl
  quantity: 1
- name: Baking tin
  quantity: 1

tables:
- name: Chocolate mixture
  stages:
  - id: melted_chocolate
    inputs:
    - ingredient: Butter
      quantity: 175
      measurement: grams
    - ingredient: White chocolate
      quantity: 175
      measurement: grams
      hint: "roughly chopped"
    action: Melt together
    hint: "in a heatproof bowl over simmering water; stir until smooth"

- name: Batter
  stages:
  - id: sugar_egg_mixture
    inputs:
    - ingredient: Sugar
      quantity: 100
      measurement: grams
    - ingredient: Brown sugar
      quantity: 100
      measurement: grams
    - ingredient: Egg
      quantity: 3
      measurement: unit
    action: Whisk together
    hint: "until combined"

  - id: chip_batter
    inputs:
    - stage: sugar_egg_mixture
    - ingredient: Flour
      quantity: 175
      measurement: grams
    - ingredient: White chocolate chips
      quantity: 250
      measurement: grams
    action: Fold in

  - id: blondie_batter
    inputs:
    - stage: chip_batter
    - stage: melted_chocolate
    action: Stir together
    hint: "until just combined"

- name: Bake
  stages:
  - id: preheat_oven
    setup: true
    action: Preheat oven and line tin
    hint: "180°C; 160°C fan"

  - id: filled_tin
    inputs:
    - stage: blondie_batter
    action: Pour into tin

  - id: baked_blondies
    inputs:
    - stage: filled_tin
    action: Bake
    hint: "22–27 min; until centre has the slightest wobble"
    duration_minutes: 27

  - id: cooled_blondies
    inputs:
    - stage: baked_blondies
    action: Cool in tin
    hint: "until completely cool"

  - id: chill_blondies
    inputs:
    - stage: cooled_blondies
    action: Refrigerate
    hint: "overnight for the fudgiest texture"

note:
- "Drizzle with melted white chocolate for decoration."
- "Add dried cranberries or macadamia nuts for extra texture."
- "The blondies will firm up significantly as they cool and chill."
