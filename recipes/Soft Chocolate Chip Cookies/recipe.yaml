schema_version: 2

meta:
  description: "Thick, chewy chocolate chip cookies with crisp edges and soft, gooey centres using chopped chocolate."
  source: "100 Cookies by Sarah Kieffer (Chronicle Books, 2020)"
  cuisine: "American"

portion:
  quantity: 24
  descriptor: "cookies"
  active_time_minutes: 20
  passive_time_minutes: 11
  complexity_rating: 2
  mayhem_rating: 2

tags:
- "Vegetarian"
- "Dessert"
- "Baking"

items:
- name: Oven
  quantity: 1
- name: Stand mixer
  quantity: 1
  sub: "or hand mixer"
- name: Baking tray
  quantity: 3
- name: Mixing bowl
  quantity: 1
- name: Wire rack
  quantity: 1

tables:
- name: Dough
  stages:
  - id: dry_mixture
    inputs:
    - ingredient: Flour
      quantity: 355
      measurement: grams
    - ingredient: Baking soda
      quantity: 1
      measurement: teaspoon
    - ingredient: Fine salt
      quantity: 0.75
      measurement: teaspoon
    action: Whisk together
    hint: "set aside"

  - id: creamed_butter
    inputs:
    - ingredient: Butter
      quantity: 170
      measurement: grams
      hint: "room temperature"
    action: Beat
    hint: "medium speed; about 1 min; until creamy"
    duration_minutes: 1

  - id: creamed_sugars
    inputs:
    - stage: creamed_butter
    - ingredient: Granulated sugar
      quantity: 150
      measurement: grams
    - ingredient: Brown sugar
      quantity: 150
      measurement: grams
    action: Beat together
    hint: "medium speed; 2–3 min; until light and fluffy; scrape down sides"
    duration_minutes: 3

  - id: egg_mixture
    inputs:
    - stage: creamed_sugars
    - ingredient: Egg
      quantity: 2
      measurement: unit
    action: Beat in
    hint: "one at a time"

  - id: flavored_mixture
    inputs:
    - stage: egg_mixture
    - ingredient: Vanilla extract
      quantity: 1.5
      measurement: teaspoon
    action: Mix
    hint: "until smooth"

  - id: cookie_dough
    inputs:
    - stage: flavored_mixture
    - stage: dry_mixture
    action: Mix
    hint: "low speed; until just combined"

  - id: chocolate_dough
    inputs:
    - stage: cookie_dough
    - ingredient: Dark chocolate
      quantity: 198
      measurement: grams
      hint: "coarsely chopped; or chocolate chips"
    action: Fold in
    hint: "until evenly distributed"

- name: Bake
  stages:
  - id: preheat_oven
    setup: true
    action: Preheat oven and line trays
    hint: "180°C; 3 trays"

  - id: portioned_cookies
    inputs:
    - stage: chocolate_dough
    action: Scoop onto trays
    hint: "45 g balls; 8 per tray; evenly spaced"

  - id: first_bake
    inputs:
    - stage: portioned_cookies
    action: Bake
    hint: "one tray at a time; 8 min; until slightly puffed in centre"
    duration_minutes: 8

  - id: tapped_cookies
    inputs:
    - stage: first_bake
    action: Tap tray
    hint: "gently against oven rack"

  - id: baked_cookies
    inputs:
    - stage: tapped_cookies
    action: Bake again
    hint: "2–3 min; edges just golden; centres soft"
    duration_minutes: 3

  - id: cool_cookies
    inputs:
    - stage: baked_cookies
    action: Tap and cool
    hint: "tap once; cool on tray 5 min; transfer to wire rack"
    duration_minutes: 5

note:
- "Chopping a bar of chocolate rather than using chips creates irregular shards and melted puddles throughout."
- "Do not overbake — the centres should look underset when removed from the oven."
- "Add a pinch of flaky sea salt on top of each dough ball before baking."
