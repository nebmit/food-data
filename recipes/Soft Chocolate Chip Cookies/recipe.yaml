schema_version: 2

meta:
  description: "Thick, chewy chocolate chip cookies with crisp edges and soft, gooey centres using chopped chocolate."
  source: "100 Cookies by Sarah Kieffer (Chronicle Books, 2020)"
  course: "Dessert"
  cuisine: "American"

portion:
  quantity: 24
  descriptor: "cookies"
  active_time_minutes: 20
  passive_time_minutes: 35
  complexity_rating: 2
  mayhem_rating: 2

tags:
- "Vegetarian"
- "Baking"

items:
- name: Oven
  quantity: 1
- name: Stand mixer
  quantity: 1
  sub: "or hand mixer"
- name: Baking tray
  quantity: 3
- name: Mixing bowl
  quantity: 1
- name: Wire rack
  quantity: 1

tables:
- name: Dough
  stages:
  - id: preheat_oven
    setup: true
    action: Preheat oven
    hint: "180°C"

  - id: line_trays
    setup: true
    action: Line trays
    hint: "with parchment paper"

  - id: whisk_dry_mixture
    inputs:
    - ingredient: Flour
      quantity: 355
      measurement: grams
    - ingredient: Baking soda
      quantity: 1
      measurement: teaspoon
    - ingredient: Salt
      quantity: 0.75
      measurement: teaspoon
    action: Whisk

  - id: cream_butter_and_sugar
    inputs:
    - ingredient: Butter
      quantity: 170
      measurement: grams
      hint: "room temperature"
    - ingredient: Sugar
      quantity: 150
      measurement: grams
    - ingredient: Brown sugar
      quantity: 150
      measurement: grams
    action: Beat
    hint: "medium speed; 2–3 min; until light and fluffy"
    duration_minutes: 3

  - id: beat_in_eggs
    inputs:
    - stage: cream_butter_and_sugar
    - ingredient: Egg
      quantity: 2
      measurement: unit
    - ingredient: Vanilla extract
      quantity: 1.5
      measurement: teaspoon
    action: Beat
    hint: "add the eggs one at a time; scrape down the sides; until smooth"

  - id: mix_cookie_dough
    inputs:
    - stage: beat_in_eggs
    - stage: whisk_dry_mixture
    action: Mix
    hint: "low speed; until just combined"

  - id: fold_in_chocolate
    inputs:
    - stage: mix_cookie_dough
    - ingredient: Dark chocolate
      quantity: 200
      measurement: grams
      hint: "coarsely chopped; or chocolate chips"
    action: Fold
    hint: "until evenly distributed"

- name: Bake
  stages:
  - id: portion_cookies
    inputs:
    - stage: fold_in_chocolate
    action: Scoop
    hint: "45 g balls; evenly spaced across the lined trays"

  - id: bake_cookies
    inputs:
    - stage: portion_cookies
    action: Bake
    hint: "one tray at a time; 8 min per tray; until slightly puffed in the centre"
    duration_minutes: 8

  - id: tap_cookies
    inputs:
    - stage: bake_cookies
    action: Tap
    hint: "the tray gently against the oven rack"

  - id: finish_baking_cookies
    inputs:
    - stage: tap_cookies
    action: Bake
    hint: "2–3 min more; until the edges are just golden and the centres still soft"
    duration_minutes: 3

  - id: cool_cookies
    inputs:
    - stage: finish_baking_cookies
    action: Cool
    hint: "tap once more; cool on the tray 5 min; then transfer to a wire rack"
    duration_minutes: 5

note:
- "Chopping a bar of chocolate rather than using chips creates irregular shards and melted puddles throughout."
- "Do not overbake — the centres should look underset when removed from the oven."
- "Add a pinch of flaky sea salt on top of each dough ball before baking."
