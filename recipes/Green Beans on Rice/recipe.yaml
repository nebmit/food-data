schema_version: 2

meta:
  description: "Stir-fried green beans and vegetables in a hoisin-ginger sauce, served over sushi rice with a runny egg on top."
  source: "Original"
  course: "Main"
  cuisine: "Asian"

portion:
  quantity: 4
  descriptor: "servings"
  active_time_minutes: 35
  passive_time_minutes: 15
  complexity_rating: 2
  mayhem_rating: 2

tags:
- "Vegetarian"

items:
- name: Small pot
  quantity: 1
- name: Large frying pan
  quantity: 1
- name: Lid
  quantity: 1

tables:
- name: Rice
  stages:
  - id: cook_sushi_rice
    inputs:
    - ingredient: Water
      quantity: 520
      measurement: ml
    - ingredient: Sushi rice
      quantity: 400
      measurement: grams
      hint: "rinsed until the water runs clear"
    action: Cook
    hint: "bring to a boil, then cover; lowest heat; 12–15 min; leave covered off the heat until serving"
    duration_minutes: 15

- name: Sauce
  stages:
  - id: mix_hoisin_sauce
    inputs:
    - ingredient: Hoisin sauce
      quantity: 100
      measurement: ml
    - ingredient: Soy sauce
      quantity: 45
      measurement: ml
    - ingredient: Vinegar
      quantity: 30
      measurement: ml
    - ingredient: Water
      quantity: 150
      measurement: ml
    - ingredient: Ginger
      quantity: 20
      measurement: grams
      hint: "peeled and finely grated"
    action: Mix

- name: Vegetables
  stages:
  - id: slice_spring_onions
    inputs:
    - ingredient: Spring onion
      quantity: 2
      measurement: unit
    action: Slice
    hint: "into rings; keep the white and green parts apart"

  - id: saute_garlic
    inputs:
    - ingredient: Vegetable oil
      quantity: 15
      measurement: ml
    - ingredient: Garlic
      quantity: 2
      measurement: clove
      hint: "finely diced"
    action: Sauté
    hint: "medium-high heat; 1 min"
    duration_minutes: 1

  - id: stir_fry_vegetables
    inputs:
    - stage: saute_garlic
    - stage: slice_spring_onions
      part: "white parts"
    - ingredient: Green beans
      quantity: 500
      measurement: grams
      hint: "ends trimmed"
    - ingredient: Bell pepper
      quantity: 2
      measurement: unit
      hint: "deseeded and sliced into thin strips"
    action: Stir-fry
    hint: "2–3 min"
    duration_minutes: 3

  - id: simmer_vegetables
    inputs:
    - stage: stir_fry_vegetables
    - stage: mix_hoisin_sauce
    action: Simmer
    hint: "bring to a boil, then cover; 6–7 min"
    duration_minutes: 7

  - id: cook_eggs
    inputs:
    - stage: simmer_vegetables
    - ingredient: Egg
      quantity: 4
      measurement: unit
    action: Poach
    hint: "make a well for each egg and crack it in; covered; 3–5 min; until the whites are set"
    duration_minutes: 5

  - id: finish_green_beans
    inputs:
    - stage: cook_eggs
    - stage: slice_spring_onions
      part: "green parts"
    - ingredient: Red chili
      quantity: 2
      measurement: unit
      hint: "sliced into fine rings; remove seeds for less heat"
    action: Garnish

- name: Assembly
  stages:
  - id: serve_green_beans_on_rice
    inputs:
    - stage: cook_sushi_rice
    - stage: finish_green_beans
    action: Serve
    hint: "divide the rice, add the vegetables, and place one egg on each serving"

note:
- "Add tofu or chicken for extra protein."
- "Adjust the chili to taste — the seeds carry most of the heat."
