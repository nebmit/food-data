# Recipe schema version. Only version 2 is supported.
schema_version: 2

meta:
  description: <String> # Short summary of the recipe
  source: <String> # Origin, publication, or "Original"
  cuisine: <String> # Cuisine type

portion:
  quantity: <Integer>
  descriptor: <String>
  active_time_minutes: <Integer>
  passive_time_minutes: <Integer>
  complexity_rating: <Integer> # 1 (very simple) to 5 (very complex)
  mayhem_rating: <Integer> # 1 (very clean) to 5 (very messy)

# Optional
tags:
- <String>

# Equipment remains outside the tabular cooking flow.
items:
- name: <String>
  quantity: <Number> # Optional, defaults to 1
  sub: <String> # Optional substitute

# Tables are ordered component flows. The last stage is the table result, and
# the last stage of the last table is the finished dish. Every other stage must
# be consumed by a later one.
tables:
- name: <String>
  stages:
  - id: <snake_case_id> # Unique across the whole recipe; named after the action
    setup: true # Optional. Action-only setup such as preheating: takes no
                # inputs, is never referenced as food, and cannot end a table.
    inputs:
    # Prepared inputs come first, then ingredient inputs.
    # Prepared input: reference an earlier stage by ID.
    - stage: <snake_case_id>
      part: <String> # Required when that stage feeds more than one later stage
    # Ingredient input: quantity and measurement must appear together.
    - ingredient: <String>
      quantity: <Number> # Optional when hint describes an unquantified amount
      measurement: <String> # grams, ml, unit, teaspoon, tablespoon, clove, pinch, can, bunch, slice, packet, leaf
      hint: <String> # Optional prep, substitution, or qualitative amount
    action: <String> # Short imperative action, capitalised
    hint: <String> # Optional time, heat, temperature, doneness, or caution; starts lowercase
    duration_minutes: <Integer> # Optional. Whole minutes to set a kitchen timer to;
                                # the upper end when the hint gives a range

# Optional recipe-level guidance
note:
- <String>
